<script>
  const video = document.getElementById('screamer');

  function triggerScreamer() {
    video.style.display = 'block';
    video.currentTime = 0;
    video.play().catch(e => console.log(e));
  }

  video.onended = () => {
    video.style.display = 'none';
  };

  const ws = new WebSocket('ws://127.0.0.1:8080/');

  ws.onopen = () => {
    // Suscribir el HTML a los eventos de Twitch Cheer en Streamer.bot
    ws.send(JSON.stringify({
      "request": "Subscribe",
      "events": {
        "Twitch": ["Cheer"]
      },
      "id": "jumpscare-overlay"
    }));
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    // Dispara si es un evento Cheer de Twitch o si recibe cualquier señal de prueba
    if ((data.event && data.event.type === 'Cheer') || data.status === 'ok') {
      triggerScreamer();
    }
  };
</script>
