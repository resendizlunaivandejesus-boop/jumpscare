<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      display: none;
    }
  </style>
</head>
<body>
  <video id="screamerVideo" src="screamer.mp4"></video>

  <script>
    const video = document.getElementById('screamerVideo');
    const ws = new WebSocket('ws://localhost:8080/');

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.action === 'jumpscare') {
        video.style.display = 'block';
        video.currentTime = 0;
        video.play();
      }
    };

    video.onended = () => {
      video.style.display = 'none';
    };
  </script>
</body>
</html>
